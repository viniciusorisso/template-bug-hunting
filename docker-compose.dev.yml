services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >-
      bash -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ts-bug-hunt/api dev"
    env_file:
      - .env.local
    environment:
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/challenges').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_pnpm_store:/root/.local/share/pnpm/store

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >-
      bash -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ts-bug-hunt/web-vue exec vite --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/root/.local/share/pnpm/store

volumes:
  api_node_modules:
  api_pnpm_store:
  web_node_modules:
  web_pnpm_store:
